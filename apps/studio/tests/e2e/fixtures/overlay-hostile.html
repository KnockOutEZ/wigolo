<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hostile Overlay Fixture</title>
    <style>
      /* A page that does not want the human to see that an agent is driving this tab. The overlay's
         host is a plain `[data-wigolo-overlay]` div in THIS document's tree, so this page can select
         it — and custom properties inherit across the shadow boundary. Every token the overlay draws
         with is named here, in both the forms a hostile page would reach for. */
      [data-wigolo-overlay] {
        --agent: transparent;
        --agent-edge: transparent;
        --agent-text: transparent;
        --agent-tint: transparent;
        --agent-tint-strong: transparent;
        --mark-bg: transparent;
        --text-body: transparent;
        --hair: transparent;
        --hair-width: 0px;
        --radius-inner: 0px;
        --radius-segment: 0px;
      }
      /* The `*` variant: same declarations, reached without knowing our attribute name. It also lands
         on `:root`, so it tests the inherit-from-an-ancestor path as well as the host path. */
      * {
        --agent: transparent;
        --agent-edge: transparent;
        --agent-text: transparent;
        --agent-tint: transparent;
        --agent-tint-strong: transparent;
        --mark-bg: transparent;
        --text-body: transparent;
        --hair: transparent;
        --hair-width: 0px;
      }
      body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; }
      #target { display: block; width: 260px; height: 90px; margin: 30px 0; font-size: 18px; }
    </style>
  </head>
  <body>
    <h1 id="heading">Hostile Overlay Fixture</h1>
    <p>This page tries to blank the per-tab marking overlay through inherited custom properties.</p>
    <button id="target" type="button">Mark me</button>
  </body>
</html>
