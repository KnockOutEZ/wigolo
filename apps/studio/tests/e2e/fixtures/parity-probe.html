<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>parity probe</title></head>
<body>
<h1>parity probe</h1>
<!--
  The parity fixture. Runs the vendored BotD detector and captures the consistency-coherence vector
  the S9 checklist asserts on, then parks both on `window.__parity` for the harness to read.

  Every value here is READ, never asserted, and the page makes no claim about what a good value is —
  the spec that reads it owns the thresholds. The probe expressions match the ones the phase-1 spike
  used against real Chrome so the two vectors are comparable.
-->
<script type="module">
  /**
   * VISIBILITY TIMELINE — recorded from the first line of script, before anything is awaited.
   *
   * `document.visibilityState` is not a constant for a page in a window that is still being mapped: a
   * renderer created while its window has no compositor surface starts HIDDEN and flips when the
   * surface arrives. A single late read therefore cannot tell "this window is starved" from "this
   * window had not finished being mapped when I looked", and those two have opposite meanings — one is
   * the regression the hidden lane exists to prevent, the other is the harness reading too early.
   *
   * So the page records the whole sequence with timestamps instead of one sample, and the harness
   * reports it on failure. Recorded, never judged: the spec owns what a good sequence looks like.
   */
  const visibilityTimeline = [{ at: 0, state: document.visibilityState, focus: document.hasFocus() }];
  document.addEventListener('visibilitychange', () => {
    visibilityTimeline.push({ at: Math.round(performance.now()), state: document.visibilityState, focus: document.hasFocus() });
  });

  /**
   * SETTLE BEFORE MEASURING — and the bound is derived, not chosen by trial.
   *
   * The window's compositor surface is acquired asynchronously, and the renderer learns about it one
   * IPC hop later. MEASURED on this build: `showInactive()` → the renderer observing `visible` takes
   * **48 ms**. The probe's own protective margin — map the window, then navigate this page over
   * loopback and reach this script — is the SAME ORDER, tens of milliseconds. Two quantities of the
   * same magnitude racing is a coin flip weighted by machine load, which is exactly the intermittent
   * that made this gate untrustworthy: on a contended run the sample landed on the pre-surface side and
   * reported `hidden` with a dead frame clock, indistinguishable from the real regression.
   *
   * So the page waits for the transition instead of racing it. 3000 ms is ~60x the measured 48 ms lag,
   * and ~3x a load-stretched estimate of it (under 24x CPU oversubscription on a 12-core box this
   * script's own start-to-sample time stretched 54 ms → 958 ms, ~18x; 48 ms x 18 ≈ 0.9 s). It costs
   * nothing on a healthy arm — the flip has already happened before this line, so it returns
   * immediately — and the arm's 20 s budget needs only ~1.3 s for the measurement, so even the full
   * wait leaves >15 s of headroom.
   *
   * THIS CANNOT MASK THE REGRESSION IT GUARDS. A window that was never mapped has no surface to
   * acquire: measured, it reports `hidden` at t=0 and is STILL `hidden` after the arm's whole budget.
   * The wait expires, the page samples `hidden` with 0 frames, and every assertion that should red does.
   * What the wait removes is only the reading taken mid-transition.
   */
  function settleVisibility(ms) {
    if (document.visibilityState !== 'hidden') return Promise.resolve(0);
    return new Promise((resolve) => {
      const started = performance.now();
      const done = () => {
        document.removeEventListener('visibilitychange', onChange);
        clearTimeout(timer);
        resolve(Math.round(performance.now() - started));
      };
      const onChange = () => { if (document.visibilityState !== 'hidden') done(); };
      document.addEventListener('visibilitychange', onChange);
      const timer = setTimeout(done, ms);
    });
  }

  const codecs = {
    avc1: 'video/mp4; codecs="avc1.42E01E"',
    hev1: 'video/mp4; codecs="hev1.1.6.L93.B0"',
    vp9: 'video/webm; codecs="vp9"',
    av01: 'video/mp4; codecs="av01.0.05M.08"',
    mp4a: 'audio/mp4; codecs="mp4a.40.2"',
    opus: 'audio/webm; codecs="opus"',
  };

  // The 12 version-gated surfaces captured from real Chrome 151. A claimed major whose API surface
  // does not match is the cross-property contradiction the whole no-spoof rule exists to avoid.
  const gatedApis = {
    BarcodeDetector: 'BarcodeDetector' in window,
    showOpenFilePicker: 'showOpenFilePicker' in window,
    scheduler: 'scheduler' in window,
    documentPictureInPicture: 'documentPictureInPicture' in window,
    ink: 'ink' in navigator,
    hid: 'hid' in navigator,
    usb: 'usb' in navigator,
    serial: 'serial' in navigator,
    CSSPropertyRule: 'CSSPropertyRule' in window,
    ViewTransition: 'ViewTransition' in window,
    cookieStore: 'cookieStore' in window,
    Notification: 'Notification' in window,
  };

  const FONTS = ['Helvetica Neue', 'Arial', 'Times New Roman', 'Courier New', 'Menlo',
    'Segoe UI', 'Calibri', 'Tahoma', 'Ubuntu', 'DejaVu Sans', 'Liberation Sans', 'Roboto'];

  function fontsPresent() {
    if (!document.fonts || !document.fonts.check) return null;
    return FONTS.filter((f) => { try { return document.fonts.check(`12px "${f}"`); } catch { return false; } });
  }

  function webglRenderer() {
    try {
      const gl = document.createElement('canvas').getContext('webgl');
      if (!gl) return null;
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      return ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : null;
    } catch { return null; }
  }

  async function coherence() {
    const v = document.createElement('video');
    const uad = navigator.userAgentData;
    let hints = null;
    if (uad && uad.getHighEntropyValues) {
      try {
        hints = await uad.getHighEntropyValues(['platform', 'platformVersion', 'architecture', 'bitness', 'model', 'uaFullVersion', 'fullVersionList']);
      } catch { hints = null; }
    }
    return {
      userAgent: navigator.userAgent,
      appVersion: navigator.appVersion,
      // `brands` is a live object list; JSON-normalise it so two arms can be compared byte for byte.
      brands: uad ? uad.brands.map((b) => ({ brand: b.brand, version: b.version })) : null,
      mobile: uad ? uad.mobile : null,
      hints,
      webdriver: navigator.webdriver,
      devicePixelRatio: window.devicePixelRatio,
      hardwareConcurrency: navigator.hardwareConcurrency,
      deviceMemory: navigator.deviceMemory ?? null,
      pluginCount: navigator.plugins ? navigator.plugins.length : null,
      languages: Array.from(navigator.languages || []),
      codecs: Object.fromEntries(Object.entries(codecs).map(([k, t]) => [k, v.canPlayType(t)])),
      gatedApis,
      fonts: fontsPresent(),
      webglRenderer: webglRenderer(),
      // Attestation surface — a recorded ceiling, captured so it is visible rather than assumed.
      hasPrivateToken: typeof document.hasPrivateToken,
      requestMediaKeySystemAccess: typeof navigator.requestMediaKeySystemAccess,
      // Hidden-vs-visible behavioural surface (checklist item 6).
      visibilityState: document.visibilityState,
      hasFocus: document.hasFocus(),
      // The sequence behind that single value, plus when it was sampled, so a red assertion can say
      // whether the window was starved or merely not mapped yet.
      visibilityTimeline: visibilityTimeline.slice(),
      visibilitySampledAt: Math.round(performance.now()),
      outerWidth: window.outerWidth,
      innerWidth: window.innerWidth,
      // Timer + rAF cadence: the sharpest hidden-window risk. Filled in by measure() below.
      rafFps: null,
      intervalRatio: null,
      // The raw counts behind those two ratios. A starved clock and a measurement window that closed
      // early both produce a small fps; only the raw frame count and elapsed time separate them.
      rafFrames: null,
      cadenceElapsedMs: null,
      // The visibility state AFTER the cadence window, so a flip that happened mid-measurement is
      // visible rather than averaged into a meaningless number.
      visibilityStateAfterCadence: null,
      // How long the settle took (0 = the surface was already there) and how many visibility flips
      // happened DURING the measurement. A non-zero flip count means the numbers above average a
      // starved window with a live one, so the spec refuses to score them at all.
      settleWaitedMs: null,
      flipsDuringMeasurement: null,
    };
  }

  function measureCadence(ms) {
    return new Promise((resolve) => {
      let frames = 0;
      let ticks = 0;
      const started = performance.now();
      const iv = setInterval(() => { ticks += 1; }, 10);
      const tick = () => { frames += 1; if (performance.now() - started < ms) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
      setTimeout(() => {
        clearInterval(iv);
        const elapsed = performance.now() - started;
        resolve({ rafFps: (frames / elapsed) * 1000, intervalRatio: ticks / (elapsed / 10), rafFrames: frames, cadenceElapsedMs: Math.round(elapsed) });
      }, ms);
    });
  }

  (async () => {
    const out = { ready: false };
    window.__parity = out;
    try {
      const { load } = await import('./botd/botd.esm.js');
      const botd = await load({ monitoring: false });
      const result = botd.detect();
      // Component states are kept alongside the verdict: "not a bot" with a detector that errored is
      // a different fact from "not a bot" with all detectors succeeding, and a gate must tell them apart.
      const components = botd.getComponents ? botd.getComponents() : null;
      // PER-DETECTOR results, not just the final verdict. The verdict collapses several independent
      // positives into one `botKind`, so a report built on it alone cannot say WHICH signal fired —
      // and "which" is the whole diagnostic value when something regresses.
      const detections = botd.getDetections ? botd.getDetections() : null;
      out.botd = {
        bot: result.bot,
        botKind: result.bot ? result.botKind : null,
        fired: detections
          ? Object.entries(detections).filter(([, d]) => d && d.bot).map(([k, d]) => `${k}:${d.botKind}`)
          : null,
        componentStates: components
          ? Object.fromEntries(Object.entries(components).map(([k, c]) => [k, c.state === 0 ? 'ok' : 'error']))
          : null,
      };
    } catch (err) {
      out.botdError = String(err);
    }
    try {
      const settleWaitedMs = await settleVisibility(3000);
      const measurementStartedAt = performance.now();
      out.coherence = await coherence();
      const cadence = await measureCadence(1000);
      out.coherence.rafFps = cadence.rafFps;
      out.coherence.intervalRatio = cadence.intervalRatio;
      out.coherence.rafFrames = cadence.rafFrames;
      out.coherence.cadenceElapsedMs = cadence.cadenceElapsedMs;
      out.coherence.visibilityStateAfterCadence = document.visibilityState;
      out.coherence.visibilityTimeline = visibilityTimeline.slice();
      out.coherence.settleWaitedMs = settleWaitedMs;
      out.coherence.flipsDuringMeasurement = visibilityTimeline.filter((e) => e.at >= measurementStartedAt).length;
    } catch (err) {
      out.coherenceError = String(err);
    }
    out.ready = true;
    // The live harness is Playwright-FREE on purpose — an automation-driven launch sets
    // navigator.webdriver and other markers, so a harness that reads this page over CDP would be
    // measuring itself. When a `report` endpoint is supplied the page posts its own vector back
    // instead, and no debugger has to be attached to collect it.
    const report = new URLSearchParams(location.search).get('report');
    if (report) {
      try {
        await fetch(report, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(out) });
      } catch (err) { /* the harness times the arm out; a failed post is a missing row, not a bad one */ }
    }
  })();
</script>
</body>
</html>
