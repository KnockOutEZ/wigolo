# Ways to support wigolo, for the repo's "Sponsor this project" sidebar.
#
# Only genuine funding destinations belong here — GitHub does not permit funding
# links to be used for advertising, so a sponsor's own link must never be listed
# as one. Sponsors are thanked in SPONSORS.md and on the site instead.
#
# Kept to two rows on purpose: GitHub renders each custom URL as truncated link
# text, so more entries make the sidebar noisier, not more useful. The site's
# sponsors section is the one custom link because it is the shortest URL and it
# carries both the thank-you and the how-to-sponsor contact.
buy_me_a_coffee: knockoutez
custom: "https://knockoutez.github.io/wigolo/#sponsors"
