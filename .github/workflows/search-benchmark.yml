name: Search Benchmark

on:
  schedule:
    - cron: '0 7 * * 1'  # Weekly, Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter benchmarks by category/id/tag'
        required: false
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # The explicit build below is the only build this job needs; without the opt-out the
      # root `prepare` hook builds again during `npm ci`.
      - run: npm ci
        env:
          WIGOLO_SKIP_PREPARE: '1'

      - run: npm run build

      - name: Run search benchmark
        run: npm run bench:search -- ${{ github.event.inputs.filter && format('--filter {0}', github.event.inputs.filter) || '' }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: search-benchmark-${{ github.run_number }}
          path: |
            benchmarks/search/output/search-benchmark.json
            benchmarks/search/output/search-benchmark.md
          retention-days: 90

      # The runner itself compares the run against fixtures/baseline.json and sets a non-zero exit code
      # on a regression, so the check lives with the numbers rather than in shell here. The previous
      # version asserted MRR >= 0.4 against a file the runner never wrote — an absolute floor on a
      # synthetic corpus measures the fixture, while a delta against the committed baseline measures a
      # change. `bench:search` above already fails the job.
      - name: Confirm the baseline comparison ran
        run: |
          node -e "
            const fs = require('node:fs');
            const out = './benchmarks/search/output/search-benchmark.json';
            if (!fs.existsSync(out)) { console.error('benchmark wrote no output'); process.exit(1); }
            const r = JSON.parse(fs.readFileSync(out, 'utf-8'));
            const b = JSON.parse(fs.readFileSync('./benchmarks/search/fixtures/baseline.json', 'utf-8'));
            if (r.summary.totalQueries < b.queries) {
              console.error('corpus shrank: ' + b.queries + ' -> ' + r.summary.totalQueries);
              process.exit(1);
            }
            console.log('queries=' + r.summary.totalQueries + ' mrr=' + r.summary.meanReciprocalRank.toFixed(4) + ' baseline=' + b.summary.meanReciprocalRank.toFixed(4));
          "
