name: CI

on:
  push:
    branches: [main, studio-handoff-core]
  pull_request:
    # `studio-handoff-core` is listed because the program merges slice PRs into it, not
    # into main. Without it, `pull_request` never fired for a slice PR: the 3-OS unit
    # matrix and the gate:studio type gate both ran on PUSH — i.e. AFTER merge — so every
    # slice merged with scrape-quality as its only check. That silently defeated the type
    # gate, which exists to BLOCK a PR. (It was `studio-handoff` until the studio app
    # moved to its own private repo; `tests/unit/electron-quarantine.test.ts` pins both
    # lines, so the rename and its assertion travel together.)
    branches: [main, studio-handoff-core]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-unit:
    name: lint + build + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail loudly instead of burning the 6-hour default. On the predecessor program
    # branch (`studio-handoff`, deleted from `origin` at PX0 exit — this branch descends
    # from its tip, so the measurements below still describe this history) the
    # ubuntu-latest leg of this job hangs indefinitely while the macOS and Windows
    # legs finish the same commit in 4-6 min; measured at 360 min (killed by the
    # default) as far back as 4eec8848, so it predates the CI-trigger and
    # hookTimeout changes. It stayed invisible because push runs are killed by
    # cancel-in-progress and PR runs did not exist on this branch until e29d14d7.
    # 25 min is ~5x the 5 min this job takes on `main`. The hang is NOT yet
    # diagnosed — capping it is what makes a log retrievable, since
    # `gh run view --log` refuses while a job is in progress.
    timeout-minutes: 25
    # Existing jobs never launch Electron; skip the ~100MB binary the workspaces
    # conversion would otherwise pull on every OS.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `WIGOLO_SKIP_PREPARE=1` suppresses the root `prepare` hook's build (see
      # scripts/prepare-build.mjs). Without it this job builds TWICE — once during install,
      # once at the explicit Build step below — and, worse, the install-time build lands
      # ahead of Lint, which is the exact "type error hidden behind a build failure" ordering
      # the step order here exists to prevent. Not `--ignore-scripts`: that would also skip
      # dependencies' native install scripts, which the unit tests need.
      - name: Install dependencies
        shell: bash
        env:
          WIGOLO_SKIP_PREPARE: '1'
        run: npm ci

      - name: Check no NUL bytes (grep-integrity)
        shell: bash
        run: npm run check:no-nul

      - name: Lint (tsc --noEmit)
        shell: bash
        run: npm run lint

      - name: Build
        shell: bash
        run: npm run build

      # esbuild silently DROPS `import(variable)`, so a lazily-loaded cloud-LLM
      # provider can pass the whole unit suite and `npm run dev` and be absent
      # only from the packaged binary. No test can see that: it is a property of
      # the bundle, not of the source. This runs the bundled build from a
      # directory with no node_modules — the binary's condition — and fails if a
      # provider cannot resolve. Reuses the dist/ built by the step above rather
      # than rebuilding, so it costs seconds.
      - name: Cloud-LLM providers resolve in a bundled build
        shell: bash
        run: node scripts/verify-llm-bundle-resolution.mjs

      - name: Unit tests
        shell: bash
        run: npm run test:unit

  # The type gate. `lint` alone (which the jobs above run) is only one of several checks:
  # `check:no-electron` holds the src/ electron quarantine (the core consumes no desktop shell, so a
  # Studio repo split stays a substitution rather than a rewrite), `typecheck:studio` type-checks the
  # safety-critical test files, `check:typecheck-gate` proves none of them silently dropped out of
  # that project, `typecheck:contract` type-checks the studio_* wire contract over its source, and
  # `typecheck:debt` ratchets the remaining untyped-test debt.
  # Until this job existed those gated NOTHING on a PR — a safety test could sit outside the type
  # gate and CI stayed green.
  #
  # `check:studio-typecheck` is deliberately NOT in this chain any more. It guarded the Electron
  # app's own type-check — the only thing covering `apps/studio/**` (known issue P7) — and both the
  # app and that guard now live in the private studio repo, where P7 is a live concern and the
  # guard has a CI job with a build step to plant errors into. Re-adding it here would assert on a
  # tree this repo no longer contains.
  #
  # Runs on all three desktop OS. Every check in `gate:studio` other than `lint` is a tsconfig
  # PROJECT (`tsc -p tsconfig.test.json`, `tsc -p contracts/studio-mcp/tsconfig.json`) or a
  # node script that walks the tree by path — `check-typecheck-gate.mjs`,
  # `check-src-no-electron.mjs`, `typecheck-debt-ratchet.mjs`. Project `include`/`exclude`
  # globs and hand-rolled path walks resolve differently per platform, so an ubuntu-only
  # gate was checking the one platform least likely to break them.
  #
  # Windows was dropped from this matrix until Q6 and is now restored. The cause was the one
  # the previous note predicted: `scripts/check-typecheck-gate.mjs` compared `path.relative`
  # output (`\`-separated on win32) against the `/`-separated tsconfig `include` entries, so
  # it named ALL 58 safety-critical test files as missing from a config that plainly listed
  # them. Both sides are now normalised to POSIX separators before comparison. The direction
  # of the old failure is worth keeping in mind: it over-reported (fail-closed), so no false
  # green ever shipped from it.
  gate:
    name: type gate (gate:studio) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` is what preserves the no-build invariant below now that the root
      # package has a `prepare` script (it builds `dist/` so a pinned git-dependency install
      # resolves — see scripts/prepare-build.mjs). devDependencies still install; only the
      # lifecycle hooks are skipped, which is exactly right here: every check in this job is
      # `tsc --noEmit`-class over source and needs no built output and no native modules.
      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts

      # No build step: every check here is `tsc --noEmit`-class over source, and adding a build
      # would hide a type error behind a build failure.
      - name: gate:studio (electron quarantine + lint + typecheck:studio + typecheck-gate + debt ratchet + contract)
        shell: bash
        run: npm run gate:studio

  # The FULL suite (`npm test`), on ubuntu + macOS. `lint-build-unit` already runs
  # `tests/unit` cross-OS; what this adds over it is `tests/integration` (104 files) plus
  # `tests/e2e` and the security regression — the spawn-heavy lane that launches browsers
  # and child processes. Those are precisely the tests whose behaviour is platform-specific
  # (process spawning, signal handling, path separators, file locking), so running them on
  # ubuntu alone tested the platform least likely to break them. macOS was added here and
  # passed first time.
  #
  # Windows was dropped from this matrix until Q6 and is now restored. It was dropped rather
  # than marked `continue-on-error`, on purpose: a continue-on-error job reports SUCCESS
  # whatever its steps do, so a known-red Windows leg kept that way would have manufactured
  # exactly the vacuous green this matrix exists to remove. The three files it named were
  # fixed instead — all three were TEST-HARNESS portability gaps, none was product breakage:
  #
  #   - tests/e2e/init-command.e2e.test.ts (x3) — spawned bare `npx`, which resolves to
  #     `npx.cmd` on Windows and which Node refuses to spawn without `shell: true` (the
  #     CVE-2024-27980 hardening). The child never started, so `status` came back `null`.
  #     Now spawns `node node_modules/tsx/dist/cli.mjs` directly, and asserts on
  #     `error`/`signal` first so "never ran" can never again read as a wrong exit code.
  #   - tests/integration/studio-session-target.test.ts — `EBUSY ... unlink jobs.db` from
  #     rmSync in teardown. The artifact writer enqueues an embedding job, which opens
  #     jobs.db through a module singleton `closeDatabase()` does not own. POSIX unlinks an
  #     open file happily; Windows does not. The test now closes the queue in afterEach.
  #   - tests/integration/fetch/browser-redirect-ssrf-backstop.test.ts — expected the guard's
  #     `unspecified IPv4 (0.0.0.0)` message, got `net::ERR_ADDRESS_INVALID`. The request was
  #     still REFUSED; the browser engine declined to route 0.0.0.0 before wigolo's own guard
  #     could attribute it. The security property held on Windows and the attribution differed,
  #     so the test now accepts EITHER refusal path while still failing if the request
  #     succeeds — verified by re-running it against a deleted backstop, which stays red.
  #
  # The former "ubuntu-only hang" note here is retired: it described a state that no longer
  # reproduces — this job completes in ~8 min on this branch's line of history. The timeout
  # stays at 30 min as a cap, not as a workaround.
  full-suite:
    # The label is carried in the matrix rather than derived from `matrix.os` so the ubuntu
    # leg keeps the EXACT name `full test suite (ubuntu)`. That string is a required status
    # check in `main`'s branch protection: a job rename does not update the protection rule,
    # it orphans it — the required context stops reporting and every PR to main sits on
    # "Expected — waiting for status" forever. Renaming this job is therefore a
    # settings change, not a workflow change. Do not "tidy" the label to match `matrix.os`.
    name: full test suite (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Skip the `prepare` hook's build; the explicit build below is this job's one build.
      - run: npm ci
        shell: bash
        env:
          WIGOLO_SKIP_PREPARE: '1'

      - run: npm run lint
        shell: bash

      - run: npm run build
        shell: bash

      # `--with-deps` installs Linux system packages; it has no counterpart on macOS or
      # Windows, where the browser download alone is the whole install.
      - name: Install browser engine
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - run: npm test
        shell: bash

  # better-sqlite3 publishes 10 Node-22 (ABI 127) prebuild targets for the pinned 12.9.0.
  # Eight of them — darwin-arm64/x64, linux-x64/arm64/arm, linuxmusl-x64/arm64/arm — were
  # verified on the build machine by loading the PUBLISHED release asset and driving it
  # through an FTS5 MATCH. The two win32 targets could not be: there was no Windows kernel
  # there, and the previous probe confirmed only the binaries' PE shape rather than
  # synthesise a pass. This job closes that gap on real Windows kernels, at the same
  # standard — a `require()` that returns an object only proves a file resolved, so each
  # run builds an FTS5 index and queries it.
  #
  # windows-11-arm is a GitHub-hosted arm64 runner, free and generally available for PUBLIC
  # repositories since 2025-08-07 (it is not a self-hosted label and needs no setup). This
  # repository is public. On a private fork the label does not resolve and this leg will not
  # start — that is a visibility fact about the fork, not a workflow bug.
  #
  # Deliberately no `npm ci`, and no npm at all: the probe unpacks the JS wrapper straight
  # from the registry tarball the lockfile resolves to, checked against the lockfile's
  # integrity hash. No install lifecycle runs, so prebuild-install and node-gyp cannot
  # supply a locally built binding and let the probe verify itself. That also keeps this job
  # independent of the better-sqlite3 v13 problem parked in PR #337 (v13 dropped its
  # `install` script, so npm supplies an implicit `node-gyp rebuild` and `npm ci` hard-fails
  # on a Windows box with no Visual Studio). The pin stays 12.9.0 and the probe reads it
  # from package-lock.json.
  #
  # No `continue-on-error` anywhere in this job. The whole point of the Q6 phase is deleting
  # greens that report success regardless of what their steps did.
  win32-prebuild:
    name: better-sqlite3 prebuild loads (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
            wrong_arch: win32-arm64
          - runner: windows-11-arm
            target: win32-arm64
            wrong_arch: win32-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Published ${{ matrix.target }} prebuild loads + serves an FTS5 MATCH
        shell: bash
        run: node scripts/verify-better-sqlite3-prebuild.mjs --target ${{ matrix.target }}

      # Five controls, each of which MUST be rejected. Without them a green above is
      # unfalsifiable: a probe that cannot fail says nothing about the binding it loaded.
      # `--expect-fail` inverts only the LOAD — the asset must still download and extract,
      # so a control cannot "pass" by 404ing on a mistyped target.
      - name: Negative control — wrong arch (${{ matrix.wrong_arch }})
        shell: bash
        run: node scripts/verify-better-sqlite3-prebuild.mjs --target ${{ matrix.wrong_arch }} --expect-fail

      - name: Negative control — wrong platform (linux-x64 ELF)
        shell: bash
        run: node scripts/verify-better-sqlite3-prebuild.mjs --target linux-x64 --expect-fail

      - name: Negative control — wrong libc (linuxmusl-x64)
        shell: bash
        run: node scripts/verify-better-sqlite3-prebuild.mjs --target linuxmusl-x64 --expect-fail

      - name: Negative control — wrong ABI (Node 18, v115)
        shell: bash
        run: node scripts/verify-better-sqlite3-prebuild.mjs --target ${{ matrix.target }} --abi 115 --expect-fail

      - name: Negative control — binding absent
        shell: bash
        run: node scripts/verify-better-sqlite3-prebuild.mjs --missing-binding --expect-fail

  # Clean-machine smoke on every desktop OS: a fresh global install, a real
  # `init`, then tool calls that LOAD and EXERCISE every dependency subsystem —
  # native SQLite, browser engine, ML reranker, semantic embeddings, and (when a
  # key is present) cloud-LLM synthesis. Unit tests mock these out; this is the
  # only gate that proves the deps actually work on a clean box before a PR
  # merges. NOTHING is cached between runs: each run re-installs native addons
  # and re-downloads the browser + models from scratch, so the full
  # install → download → extract → load → tool-call path is retested on a
  # genuinely clean machine every time (this is what re-exercises the
  # recursive-mkdir and corrupt-archive download-path fixes on every PR).
  clean-machine-smoke:
    name: clean-machine smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # linux-arm64 is non-blocking: its native embedding tokenizer is still being
    # validated on real ARM hardware, so it reports without gating a merge.
    continue-on-error: ${{ matrix.os == 'ubuntu-22.04-arm' }}
    # Bound the job: a stuck browser/model download on a bad runner should fail
    # in minutes, not ride the 6h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every desktop OS across the supported Node range. The floor is Node 22
        # (`engines.node: ">=22"`): Node 20 "Iron" went EOL upstream on
        # 2026-03-24, so it is no longer built or tested here. better-sqlite3
        # 13.0.3 ships prebuilt native binaries for every row: v13's are
        # Node-API, carry no ABI suffix, and all eight targets travel in the ONE
        # tarball, so there is no per-platform artifact to resolve. The
        # postinstall then drops the seven the host cannot load
        # (scripts/prune/sqlite-prebuilds.mjs).
        #
        # ⚠ AND ON WINDOWS `npm ci` STILL COMPILES FROM SOURCE, WHICH IS WHY
        # THIS PIN IS NOT MERGEABLE. An earlier version of this comment claimed
        # v13 "never falls back to a source compile on any row". That is false
        # and was written from a green macOS run; this matrix measured it. Every
        # macOS and Linux row passes, every Windows row fails, at `npm ci`:
        #   npm error command C:\...\cmd.exe /d /s /c node-gyp rebuild
        #   npm error gyp ERR! find VS could not find a version of
        #                          Visual Studio 2017 or newer to use
        # v12 shipped an `install` script (prebuild-install) that ran in pure
        # Node and exited 0 the moment it found the bundled binary, so node-gyp
        # was never invoked. v13 removed it, and npm then supplies its own
        # implicit `node-gyp rebuild` for any package carrying a binding.gyp.
        # better-sqlite3 publishes `gypfile: false` precisely to suppress that,
        # and npm ignores it (npm/cli#9837, WiseLibs/better-sqlite3#1503/#1505).
        # binding.gyp's own `prebuild_exists` guard cannot save it either: gyp
        # must CONFIGURE before it can evaluate any variable, and configure is
        # the step that needs the toolchain.
        #
        # This is not a CI-image problem to paper over. It means a Windows user
        # without Python and VC++ Build Tools cannot `npm i wigolo` at all, and
        # that is exactly the failure this clean-machine job exists to catch.
        # Revisit when npm/cli#9837 lands or better-sqlite3 restores a
        # JS-only install script.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
        include:
          # Extra linux-arm64 coverage on one Node version (non-blocking above).
          - os: ubuntu-22.04-arm
            node: '22'
    env:
      # Add GEMINI_API_KEY as a repo secret to exercise the
      # cloud-LLM path. Absent (e.g. on fork PRs) → the LLM step is skipped and
      # the job still passes on the keyless deps.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `WIGOLO_SKIP_PREPARE=1` keeps this to ONE build: the `prepare` hook would otherwise
      # full-build during `npm ci`, and this is the 3-OS × Node-22/24 matrix where that costs
      # the most. It does not weaken the clean-machine claim — this job installs from the
      # working tree and then builds explicitly; the git-dependency install path that `prepare`
      # exists for is a different consumer and is covered by tests/unit/prepare-build.test.ts.
      - name: Install + build
        shell: bash
        env:
          WIGOLO_SKIP_PREPARE: '1'
        run: npm ci && npm run build

      - name: Pack + global install (fresh `npm i -g wigolo`)
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # warmup does the real install below
          # `npm pack` runs `prepare` unconditionally — it is the hook's whole reason to
          # exist — so without this the job full-builds a SECOND time on every one of the
          # 6+1 matrix legs and the comment above is false. dist/ is already fresh from the
          # previous step and pack reads the working tree, so the tarball is identical.
          WIGOLO_SKIP_PREPARE: '1'
        run: |
          TGZ=$(npm pack 2>/dev/null | tail -1)
          echo "packed: $TGZ"
          npm i -g "./$TGZ"

      - name: init completes (exit 0) on a fresh machine
        shell: bash
        run: wigolo init --no-warmup --non-interactive --agents=codex --plain

      # ---------------------------------------------------------------- budgets
      # The install/size/footprint gates live here rather than in a workflow of
      # their own because this job already does the exact sequence a budget
      # needs — pack, global install, init, warmup, real tool calls — and it is
      # already required. A unit test cannot measure an install.
      #
      # macOS only, on purpose. Install size is NOT platform-invariant (`@img/*`,
      # `@napi-rs/*` and `wreq-js` all resolve to platform-specific packages) and
      # the thresholds in scripts/budget/protocol.mjs are anchored to real
      # darwin-arm64 observations. Gating linux and win32 against a darwin number
      # would be gating against a guess, which is the failure these gates exist
      # to prevent. Their baselines are follow-up work, not a copy of this one.
      - name: budget — acquisition snapshot (before warmup)
        if: matrix.os == 'macos-latest' && matrix.node == '22'
        shell: bash
        run: node "$GITHUB_WORKSPACE/scripts/budget/measure.mjs" acquire-snapshot "$RUNNER_TEMP/acquire.json"

      - name: warmup loads + self-tests every native/model dep
        shell: bash
        run: |
          # chromium always installs; --reranker/--embeddings add the ML models,
          # each with a real self-test (browser launch, one rerank, one embed).
          # linux-arm64 has no embeddings tokenizer binary (a known upstream gap)
          # and `warmup --embeddings` THROWS there, so skip it on ARM entirely and
          # assert browser + reranker only — the ARM job still gates the browser
          # engine, ranking model, native SQLite, and the tool calls below.
          if [ "${{ matrix.os }}" = "ubuntu-22.04-arm" ]; then
            wigolo warmup --reranker --json > warm.json
            KEYS='browserEngine reranker'
          else
            wigolo warmup --reranker --embeddings --json > warm.json
            KEYS='browserEngine reranker embeddings'
          fi
          node -e "const r=JSON.parse(require('fs').readFileSync('warm.json','utf8')); for (const k of process.argv.slice(1)){ if (r[k] !== 'ok'){ console.error('DEP FAILED:', k, '=', r[k], r[k+'Error']||''); process.exit(1) } } console.log('native + model deps OK ('+process.argv.slice(1).join(', ')+')')" $KEYS

      # CLOSES G-ACQUIRE'S MEASUREMENT WINDOW, and it has to be here rather than at the
      # assertion. The gate's title is "bytes `warmup` downloads"; the assertion runs three
      # steps and ~3 minutes below, and the step immediately after this one fetches a live page
      # and runs a live search against the DEFAULT data directory. Differencing live at
      # assertion time therefore charged every byte of cached web content those wrote to
      # warmup — 1-13 MiB of pure run-to-run noise, on a gate that has been passing at 793
      # against 800. The assertion deliberately stays where it is (steps stop at the first
      # failure, so an acquisition red must not hide the tool-call result); only the window
      # moves.
      - name: budget — acquisition snapshot (the instant warmup exits)
        if: matrix.os == 'macos-latest' && matrix.node == '22'
        shell: bash
        run: node "$GITHUB_WORKSPACE/scripts/budget/measure.mjs" acquire-snapshot "$RUNNER_TEMP/acquire-after.json"

      - name: tool calls prove the wired pipeline (fetch/extract/cache, search/rerank)
        shell: bash
        run: |
          for i in 1 2 3; do wigolo fetch https://example.com --json > fetch.json && break; echo "fetch retry $i" >&2; sleep 5; done
          node -e "const t=require('fs').readFileSync('fetch.json','utf8'); JSON.parse(t); if (t.length < 50){ console.error('fetch/extract produced trivial output'); process.exit(1) } console.log('fetch + extract + cache OK ('+t.length+'b)')"
          for i in 1 2 3; do wigolo search 'typescript programming language' --json > search.json && break; echo "search retry $i" >&2; sleep 5; done
          node -e "const t=require('fs').readFileSync('search.json','utf8'); JSON.parse(t); if (t.length < 50){ console.error('search/rerank produced trivial output'); process.exit(1) } console.log('search + rerank + sqlite OK')"

      # Both of these shipped report-only in S10-a for one stated reason: their
      # thresholds came from a developer Mac and nobody had measured a GitHub
      # runner, which is a different machine class. That data now exists, so
      # they block — but they block on runner numbers, not on the laptop ones.
      #
      # WIGOLO_BUDGET_MACHINE_CLASS is passed explicitly rather than sniffed
      # from CI, so a gate can never quietly apply the wrong class's limit.
      #
      # G-COLD-START needed no threshold change at all: the runner measured
      # 828 ms median against a 1500 ms bound.
      #
      # G-RSS-IDLE needed both a runner limit (185 MiB) and a change of
      # cross-run reducer, median -> minimum. The reasoning is in
      # scripts/budget/protocol.mjs (RSS_CROSS_RUN_REDUCER); the short version
      # is that a blocking median gate had a 6 MiB window to aim at, against
      # inputs whose own spread is 33 MiB, and a blocking gate that reds a clean
      # build teaches people to re-run CI.
      #
      # These run BEFORE the deterministic gates on purpose. Steps stop at the
      # first failure, so putting the slow measurements after the assertions
      # means the run that reds tells you nothing about the other numbers.
      - name: budget gates — idle RSS floor, cold start (blocking, runner class)
        if: matrix.os == 'macos-latest' && matrix.node == '22'
        shell: bash
        env:
          WIGOLO_BUDGET_MACHINE_CLASS: ci-runner
        run: |
          cd "$GITHUB_WORKSPACE"
          node scripts/budget/measure.mjs idle-rss
          node scripts/budget/measure.mjs cold-start

      # Blocking. All three are deterministic: a completed install, a pack
      # manifest, and a `du` difference across a step that has already run.
      #
      # These carry no per-class limit — an install size and a tarball do not
      # differ by machine class the way a memory floor does — so they stay on
      # the default class and the report says so.
      - name: budget gates — install size, tarball, acquired bytes (blocking)
        if: matrix.os == 'macos-latest' && matrix.node == '22'
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/scripts/budget/measure.mjs" install-size
          node "$GITHUB_WORKSPACE/scripts/budget/measure.mjs" tarball
          node "$GITHUB_WORKSPACE/scripts/budget/measure.mjs" acquire-diff "$RUNNER_TEMP/acquire.json" "$RUNNER_TEMP/acquire-after.json"

      # S10-d's tier-conditional pair, run as TWO ARMS of the same measurement.
      #
      # Neither arm is wired without the other, and that is the point. Read alone, the desktop
      # gate's `<= 320` passes trivially on a host that acquired nothing at all — a gate that
      # cannot tell "correctly acquired" from "did nothing". The claim is carried by the
      # DIFFERENTIAL: same command, same artifact, same job, same component available to install,
      # and only the resolved tier differs. The desktop arm must take it; the headless arm must
      # take exactly zero bytes of it.
      #
      # WIGOLO_SUBSTRATE_PATH supplies a real component to acquire. There is no published one yet
      # — that is S16-alpha — so without it BOTH arms would measure zero and the pair would prove
      # nothing about the branch. WIGOLO_BROWSER_TIER forces each tier rather than waiting for a
      # runner of each kind, because what is under test is the dispatch, not the detection (the
      # detection has its own unit coverage, and a macOS runner cannot produce a no-display host).
      #
      # Each arm gets its own WIGOLO_DATA_DIR so the desktop arm's acquisition cannot be mistaken
      # for the headless arm's, and the gate id is passed explicitly so a runner can never report
      # one arm against the other's expectation.
      - name: budget gates — tier-conditional acquisition, both arms (blocking)
        if: matrix.os == 'macos-latest' && matrix.node == '22'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          COMPONENT="$RUNNER_TEMP/fake-component"
          mkdir -p "$COMPONENT/bin"
          printf '{"version":"ci-arm","executable":"bin/run"}' > "$COMPONENT/substrate.json"
          printf '#!/bin/sh\nexit 0\n' > "$COMPONENT/bin/run"
          chmod +x "$COMPONENT/bin/run"
          export WIGOLO_SUBSTRATE_PATH="$COMPONENT"

          for ARM in desktop no-display; do
            if [ "$ARM" = "desktop" ]; then GATE=G-ACQUIRE-SUBSTRATE-DESKTOP; else GATE=G-ACQUIRE-SUBSTRATE-HEADLESS; fi
            export WIGOLO_DATA_DIR="$RUNNER_TEMP/tier-$ARM"
            export WIGOLO_BROWSER_TIER="$ARM"
            mkdir -p "$WIGOLO_DATA_DIR"
            node scripts/budget/measure.mjs substrate-snapshot "$RUNNER_TEMP/substrate-$ARM.json"
            wigolo warmup --json --plain > "warm-$ARM.json"
            echo "$ARM warmup: $(cat "warm-$ARM.json")"
            node scripts/budget/measure.mjs substrate-diff "$RUNNER_TEMP/substrate-$ARM.json" "$GATE"
          done

          # The dispatch itself, not just the byte counts: the desktop arm must report the
          # component acquired AND the browser engine skipped (amended-D1's no-doubling rule),
          # and the headless arm must report no component attempt at all.
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('warm-desktop.json', 'utf8'));
            const h = JSON.parse(fs.readFileSync('warm-no-display.json', 'utf8'));
            const fail = (m) => { console.error('DISPATCH FAILED:', m); process.exit(1); };
            if (d.desktopComponent !== 'acquired') fail('desktop arm did not acquire: ' + d.desktopComponent);
            if (d.browserEngine !== 'skipped') fail('desktop arm also took the engine slot: ' + d.browserEngine);
            if (h.desktopComponent !== undefined) fail('no-display arm attempted a component: ' + h.desktopComponent);
            console.log('tier-conditional dispatch OK');
          "

      - name: cloud-LLM synthesis (Gemini) — proves the LLM path + key wiring
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22' && env.GEMINI_API_KEY != ''
        # Best-effort: an external LLM API's quota or a transient error must not
        # fail this required job. It verifies the synthesis path when it can.
        continue-on-error: true
        shell: bash
        run: |
          wigolo search 'what is the capital of France' --format answer --json > ans.json
          node -e "const r=JSON.parse(require('fs').readFileSync('ans.json','utf8')); const a=r.answer; if (typeof a !== 'string' || a.length < 5){ console.error('LLM synthesis produced no answer field. Response head:', JSON.stringify(r).slice(0,400)); process.exit(1) } console.log('LLM synthesis OK:', a.slice(0,60))"
