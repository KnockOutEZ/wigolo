name: Arabic Search CI

on:
  push:
    branches:
      - feat/arabic-search-support
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: arabic-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + build + Arabic unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Arabic search regression tests
        run: npm run test:unit -- tests/unit/search/core

      - name: Full unit suite
        run: npm run test:unit

  cross-platform:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  package:
    name: build package artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create npm package
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wigolo-arabic-search-build
          path: "*.tgz"
          if-no-files-found: error
