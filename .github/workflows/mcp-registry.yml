name: MCP Registry

# Publishes the current package.json version to the Official MCP Registry.
# Called by release.yml after every npm and PyPI publish, and can be run by
# hand (Actions > MCP Registry > Run workflow on main) to republish a version
# the release missed. GitHub OIDC authenticates the io.github.KnockOutEZ/*
# namespace, so no secret is needed.
#
# The registry checks that the npm version exists, and a fresh npm publish can
# take a few minutes to show up, so this waits for npm before publishing and
# retries a refused publish.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for npm to serve this version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if [ "$(npm view "wigolo@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves wigolo@$VERSION"
              exit 0
            fi
            echo "wigolo@$VERSION not on npm yet, waiting ($i/30)"
            sleep 20
          done
          echo "::error::wigolo@$VERSION never showed up on npm"
          exit 1

      - name: Publish to MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          rm -f server.json
          ./mcp-publisher init
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "publish refused, retrying in 60s ($i/5)"
            sleep 60
          done
          echo "::error::could not publish io.github.KnockOutEZ/wigolo@$VERSION to the MCP Registry"
          exit 1
